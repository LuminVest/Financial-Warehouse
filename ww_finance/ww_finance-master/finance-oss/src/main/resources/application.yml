server:
  port: 8130 # 服务端口

spring:
  application:
    name: service-oss # 服务名（网关路由 /oss/** 依赖此注册名）
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848 # nacos服务地址（服务器部署改为服务器IP）
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# 文件上传存储目录（服务器部署改为 /www/uploads/）
oss:
  upload-dir: D:/uploads/