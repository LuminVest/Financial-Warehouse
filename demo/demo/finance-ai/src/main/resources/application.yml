spring:
  ai:
    dashscope:
      api-key: sk-ws-H.EPYXDML.ereg.MEQCIBnNTDppiYeUvdWedRUYufPP0jBhq-g8Nv8xpdw_EEq7AiANS0OKaprV4QijpqpNySB-W0KgUQNQ3pHooX0XHKKP0w
      chat:
        options:
          model: qwen-turbo
          temperature: 0.7
      embedding:
