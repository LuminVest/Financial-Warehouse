spring:
  profiles:
    active: dev # 环境设置
  application:
    name: service-oss # 服务名

  cloud:
    nacos:
      # 全局用户名/密码：discovery 和 config 继承该值；两端不同时再各子节点覆盖
      username: nacos
      password: shangqiuqwjk832
      discovery:
        enabled: true
        server-addr: 127.0.0.1:9838
        namespace: public
        # 如需单独覆盖鉴权，可在 discovery 下再写 username/password
      config:
        enabled: true
        import-check:
          enabled: false
        group: DEFAULT_GROUP
        server-addr: 127.0.0.1:9838
        namespace: public
        file-extension: yaml
        # dataId = ${prefix}-${spring.profiles.active}.${file-extension}
        # prefix 默认取 spring.application.name，即 service-oss-dev.yaml
        prefix: ${spring.application.name}

logging:
  level:
    com:
      alibaba:
        nacos:
          client: info # 本地调试阶段开 info：gRPC 端口不通/鉴权失败/注册重试等细节会打出来，否则 error 级别会吞掉这些报错
