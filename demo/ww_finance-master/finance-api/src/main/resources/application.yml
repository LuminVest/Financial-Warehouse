server:
  port: 8990 #服务端口号


spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/xx_finance?serverTimezone=GMT%2B8&characterEncoding=utf-8
    username: root
    password: root

  cloud:
      nacos:
        discovery:
          username: nacos
          password: nacos
          enabled: true        # 开启服务注册
          register-enabled: true  # 向 nacos 注册自己
          server-addr: localhost:8848 # nacos 服务地址

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.wwfinance.api.entity
  configuration:
    map-underscore-to-camel-case: true

devtools:
  restart:
    enabled: true  # 开启热部署
    additional-paths: src/main/java # 重启目录
    exclude: WEB-INF/**