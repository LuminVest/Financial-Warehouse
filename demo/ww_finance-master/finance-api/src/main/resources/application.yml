server:
  port: 8990 #服务端口号


spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/xx_finance?serverTimezone=GMT%2B8&characterEncoding=utf-8
    username: root
    password: root

  # 注册验证码缓存（与短信服务共用同一个 Redis）
  redis:
    host: localhost
    port: 6379
    database: 0
    password: #默认为空
    timeout: 3000ms #最大等待时间，超时则抛出异常，否则请求一直等待
    lettuce:
      pool:
        max-active: 20  #最大连接数，负值表示没有限制，默认8
        max-wait: -1    #最大阻塞等待时间，负值表示没限制，默认-1
        max-idle: 8     #最大空闲连接，默认8
        min-idle: 0     #最小空闲连接，默认0

  cloud:
      nacos:
        discovery:
          username: nacos
          password: nacos
          enabled: true        # 开启服务注册
          register-enabled: true  # 向 nacos 注册自己
          server-addr: localhost:8848 # nacos 服务地址

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.wwfinance.api.entity
  configuration:
    map-underscore-to-camel-case: true

devtools:
  restart:
    enabled: true  # 开启热部署
    additional-paths: src/main/java # 重启目录
    exclude: WEB-INF/**
